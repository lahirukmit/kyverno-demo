apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow latest image tag
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Requires an explicit image tag and blocks the mutable tag :latest.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: require-image-tag-not-latest
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
      validate:
        message: "Image must use a pinned tag. ':latest' is not allowed."
        pattern:
          spec:
            containers:
              - image: "*:* & !*:latest"
